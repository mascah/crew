name: crew
version: 0.1.0
description: "Crew activity observer. Appends small local events; never calls the network."
provides_hooks:
  - on_session_start
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_human_input_request
  - on_human_input_resolved
  - subagent_start
  - subagent_stop
